server {
  listen 80;
  server_name _;

  root /usr/share/nginx/html;
  index index.html;

  location = /health {
    default_type text/plain;
    return 200 "ok\n";
  }

  location = /robots.txt {
    try_files $uri =404;
  }

  location = /sitemap-index.xml {
    try_files $uri =404;
  }

  location ~* ^/_astro/ {
    add_header Cache-Control "public, max-age=31536000, immutable";
    try_files $uri =404;
  }

  location ~* \.(?:css|js|mjs|json|png|jpg|jpeg|gif|webp|svg|ico|woff|woff2)$ {
    add_header Cache-Control "public, max-age=2592000";
    try_files $uri =404;
  }

  location / {
    try_files $uri $uri/ $uri.html =404;
  }

  error_page 404 /404.html;
}
