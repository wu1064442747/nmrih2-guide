name: Publish GHCR Image

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository_owner }}/nmrih2-guide

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=main,enable={{is_default_branch}}
            type=sha,prefix=git-

      - name: Build and push
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          build-args: |
            SITE_URL=${{ vars.SITE_URL || 'https://no-moreroominhell2.wiki' }}
            GOOGLE_SITE_VERIFICATION=${{ vars.GOOGLE_SITE_VERIFICATION }}
            MICROSOFT_CLARITY_PROJECT_ID=${{ vars.MICROSOFT_CLARITY_PROJECT_ID || 'y1qesbkovd' }}
            PLAUSIBLE_DOMAIN=${{ vars.PLAUSIBLE_DOMAIN || 'no-moreroominhell2.wiki' }}
            PLAUSIBLE_SCRIPT_SRC=${{ vars.PLAUSIBLE_SCRIPT_SRC || 'https://plausible.ai-baby-dance.com/js/script.js' }}
